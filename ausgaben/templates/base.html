<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ausgaben{% endblock %} – Gemeinschaftskonto</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1e293b; --muted: #64748b; --line: #e2e8f0;
    --accent: #2563eb; --good: #16a34a; --bad: #dc2626;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --line: #334155;
      --accent: #60a5fa; --good: #4ade80; --bad: #f87171;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  nav { max-width: 1200px; margin: 0 auto; padding: .6rem 1rem; display: flex;
        gap: 1.2rem; align-items: center; flex-wrap: wrap; }
  nav strong { margin-right: auto; }
  nav a { color: var(--muted); text-decoration: none; font-weight: 500; }
  nav a:hover, nav a.active { color: var(--accent); }
  main { max-width: 1200px; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.4rem; margin: .5rem 0 1rem; }
  h2 { font-size: 1.05rem; margin: 0 0 .8rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 1rem; }
  .grid { display: grid; gap: 1rem; margin-bottom: 1rem; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
  .kpi small { color: var(--muted); display: block; }
  .kpi b { font-size: 1.4rem; }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .chart-box { position: relative; height: 300px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: .85rem; }
  td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%;
         margin-right: .4rem; }
  .muted { color: var(--muted); }
  input, select, button { font: inherit; color: inherit; background: var(--card);
         border: 1px solid var(--line); border-radius: 6px; padding: .4rem .6rem; }
  button { cursor: pointer; background: var(--accent); color: #fff; border-color: var(--accent); }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  .flash { padding: .6rem .9rem; border-radius: 8px; margin-bottom: 1rem; }
  .flash.ok { background: color-mix(in srgb, var(--good) 15%, var(--card)); }
  .flash.error { background: color-mix(in srgb, var(--bad) 15%, var(--card)); }
  .purpose { max-width: 38ch; color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
  .inline { display: inline; }
</style>
</head>
<body>
<header>
  <nav>
    <strong>Gemeinschaftskonto</strong>
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Auswertung</a>
    <a href="{{ url_for('transactions') }}" class="{{ 'active' if request.endpoint == 'transactions' }}">Buchungen</a>
    <a href="{{ url_for('import_csv') }}" class="{{ 'active' if request.endpoint == 'import_csv' }}">Import</a>
    <a href="{{ url_for('settings') }}" class="{{ 'active' if request.endpoint == 'settings' }}">Einstellungen</a>
    {% if config.APP_PASSWORD %}
    <form method="post" action="{{ url_for('logout') }}" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="ghost">Abmelden</button>
    </form>
    {% endif %}
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
