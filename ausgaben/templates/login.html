{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<div class="card" style="max-width: 360px; margin: 3rem auto;">
  <h1>Anmelden</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="row">
      <input type="password" name="password" placeholder="Passwort" autofocus required style="flex:1">
      <button>Anmelden</button>
    </div>
  </form>
</div>
{% endblock %}
